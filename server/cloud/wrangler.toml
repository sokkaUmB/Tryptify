# Tryptify Cloud on Cloudflare Workers. Secrets are NOT here: set them with
#   wrangler secret put CREEM_API_KEY
#   wrangler secret put CREEM_WEBHOOK_SECRET
name = "tryptify-cloud"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "tryptify-cloud"
database_id = "b2b03937-98bd-4fec-a132-ce0d0b932454"

# The listeners' music (phase 1). Downloads from R2 are free; storage is
# $0.015 per GB-month, the figure the plans were priced with.
[[r2_buckets]]
binding = "MUSIC"
bucket_name = "tryptify-cloud-music"

# Creem, TEST mode for now. Going live: remove CREEM_API_BASE and replace the
# product ids with the live ones (they are not secrets).
[vars]
CREEM_API_BASE = "https://test-api.creem.io"
CREEM_PRODUCT_LITE_MONTHLY = "prod_6eEoCud9ol0vn8H4OyJpt5"
CREEM_PRODUCT_LITE_YEARLY = "prod_2JlQubP2pnowVTuzXkfiGu"
CREEM_PRODUCT_PLUS_MONTHLY = "prod_5pm12qQ3N2KCCG6qtZ3dtV"
CREEM_PRODUCT_PLUS_YEARLY = "prod_1TGw8qSxCjKxq0MSiLuyI0"
CREEM_PRODUCT_MAX_MONTHLY = "prod_21MRJ0oZMS7dusCMGBLX0l"
CREEM_PRODUCT_MAX_YEARLY = "prod_7TtInxGK5fNOs0VKHHpdY3"
CREEM_PRODUCT_LITE_MONTHLY_TRIAL = "prod_7B4iLXRJKPaeSjOy4BmBir"
CREEM_PRODUCT_PLUS_MONTHLY_TRIAL = "prod_7CntKejjZyg6Lt3BbmtIkQ"
CREEM_PRODUCT_MAX_MONTHLY_TRIAL = "prod_3S0jO8p2OwGiaVQHg3xO59"
