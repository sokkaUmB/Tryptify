# The Tryptify website: static files served by Cloudflare (Workers static
# assets), plus src/worker.js for the APK download. Deploy: npx wrangler deploy
# (from this folder).
name = "tryptify-site"
# Only /download/tryptify.apk runs code (src/worker.js); every other path is a static file.
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# tryptify.com and www.tryptify.com (a zone on this Cloudflare account).
routes = [
  { pattern = "tryptify.com", custom_domain = true },
  { pattern = "www.tryptify.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/download/tryptify.apk"]
# /cloud serves cloud.html, /terms serves terms.html, and so on.
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

# The APK, too big for a static file.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "tryptify-downloads"
