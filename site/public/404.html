<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Tryptify</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      var root = document.documentElement, top = window.top === window;
      // The design and font: ?design=… / ?font=… (a preview), else the ones last picked.
      var q = new URLSearchParams(location.search), d = q.get("design"), f = q.get("font");
      try {
        if (d && top) localStorage.setItem("tryptify-design", d);
        if (f && top) localStorage.setItem("tryptify-font", f);
        if (!d) d = localStorage.getItem("tryptify-design");
        if (!f) f = localStorage.getItem("tryptify-font");
      } catch (e) {}
      if (/^(dark|warm|white)$/.test(d || "")) root.dataset.design = d;
      if (/^(space-grotesk|sora|outfit|manrope|bricolage|instrument|chivo|plex|fraunces|jetbrains)$/.test(f || "")) root.dataset.font = f;
      // Motion only when it is welcome; if site.js has not started in 3 s, show everything as is.
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        root.classList.add("motion");
        setTimeout(function () { if (!window.__tryptifyMotion) root.classList.remove("motion"); }, 3000);
      }
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>That page isn't here.</h1>
      <p class="lead">Try the <a href="/">app page</a> or <a href="/cloud">Tryptify Cloud</a>.</p>
    </section>
  </main>
  <script src="/js/motion-12.23.12.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
